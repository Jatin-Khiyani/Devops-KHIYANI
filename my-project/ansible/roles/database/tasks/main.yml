---
- name: Launch database container
  community.docker.docker_container:
    name: database
    image: "{{ dockerhub_username }}/tp-devops-database:latest"
    state: started
    restart_policy: unless-stopped
    networks:
      - name: my-network
    env:
      POSTGRES_DB: "{{ db_name }}"
      POSTGRES_USER: "{{ db_user }}"
      POSTGRES_PASSWORD: "{{ db_password }}"