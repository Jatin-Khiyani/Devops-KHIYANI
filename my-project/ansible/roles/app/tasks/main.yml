---
- name: Launch backend app container
  community.docker.docker_container:
    name: backend
    image: "{{ dockerhub_username }}/tp-devops-simple-api:latest"
    state: started
    restart_policy: unless-stopped
    networks:
      - name: my-network
    env:
      DB_HOST: "{{ db_host }}"
      DB_NAME: "{{ db_name }}"
      DB_USER: "{{ db_user }}"
      DB_PASSWORD: "{{ db_password }}"