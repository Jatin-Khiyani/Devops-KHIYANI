services:

  database:
    build: ./database
    container_name: postgres
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  backend-blue:
    build: ./Backend/Springboot
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

  backend-green:
    build: ./Backend/Springboot
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

  frontend:
    build: ./frontend
    depends_on:
      - backend-blue
      - backend-green

  httpd:
    build: ./httpd
    ports:
      - "80:80"
    environment:
      FRONTEND_HOST: frontend
    depends_on:
      - frontend
      - backend-blue
      - backend-green