name: CI devops 2025
on:
  #to begin you want to launch this job in main and develop
  push:
    branches: 
    - main
    - develop
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-24.04
    environment: Docker-env
    steps:
      #checkout your github code using actions/checkout@v4
      - uses: actions/checkout@v4

      #do the same with another action (actions/setup-java@v4) that enable to setup jdk 21
      - name: Set up JDK 21
        #TODO
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      #finally build your app with the latest command
      - name: Build and test with Maven
        run: mvn clean verify
        working-directory: TP-1/Backend/Springboot

  Sonar:
    needs: test-backend
    runs-on: ubuntu-24.04
    environment: Docker-env

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        #TODO
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

        # Sonar Analysis (Comment added to push)
      - name: SonarCloud
        run: mvn -B verify sonar:sonar -Dsonar.projectKey=${{ secrets.PROJECT_KEY }} -Dsonar.organization=${{ secrets.ORGANIZATION_KEY }} -Dsonar.host.url=https://sonarcloud.io -Dsonar.login=${{ secrets.SONAR_TOKEN }}
        working-directory: TP-1/Backend/Springboot

 
